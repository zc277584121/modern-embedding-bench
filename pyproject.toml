[project]
name = "modern-ir-bench"
version = "0.1.0"
description = "A code-native benchmark for modern information retrieval solutions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.0,<5",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pymilvus[milvus-lite]>=3.0,<3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_ir_bench"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests/modern_ir"]
pythonpath = ["."]
norecursedirs = [".*", "build", "dist", "results", "legacy"]
